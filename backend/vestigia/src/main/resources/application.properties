spring.application.name=vestigia
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vestigia}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE

# Evidencia: SQL ejecutado y logs a archivo
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.file.name=logs/vestigia-backend.log

management.endpoints.web.exposure.include=health,metrics
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173
