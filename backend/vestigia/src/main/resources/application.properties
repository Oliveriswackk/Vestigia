spring.application.name=vestigia
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vestigia}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Configuración local opcional (credenciales propias). Ignorada por git.
# Copiar application-local.properties.example a application-local.properties.
spring.config.import=optional:file:./application-local.properties

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE

# Evidencia: SQL ejecutado y logs a archivo
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.file.name=logs/vestigia-backend.log

management.endpoints.web.exposure.include=health,metrics
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173
